[tool.poetry]
name = "douyin-downloader"
version = "0.1.0"
description = "Download Douyin videos without watermark via Playwright API interception"
authors = []
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.44"
aiohttp = "^3.9"
aiofiles = "^23.2"
rich = "^13.7"
click = "^8.1"
yt-dlp = ">=2026.8.19"
faster-whisper = ">=1.0.0"
httpx = ">=0.27"
python-dotenv = ">=1.0"
pytest = ">=8.0"
pydantic = "^2.0"
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
douyin = "main:cli"
